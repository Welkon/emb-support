name: adapter vectors

on:
  push:
    paths:
      - 'adapters/**'
      - 'tests/run-tests.cjs'
      - '.github/workflows/adapter-vectors.yml'
  pull_request:
    paths:
      - 'adapters/**'
      - 'tests/run-tests.cjs'
      - '.github/workflows/adapter-vectors.yml'

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Algorithm vectors
        run: node tests/run-tests.cjs
