name: altium-pcb skill

on:
  push:
    paths:
      - 'skills/altium-pcb/**'
      - '.github/workflows/altium-pcb-tests.yml'
  pull_request:
    paths:
      - 'skills/altium-pcb/**'
      - '.github/workflows/altium-pcb-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        working-directory: skills/altium-pcb
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI smoke test
        working-directory: skills/altium-pcb
        run: python scripts/altium_pcb.py --help
      - name: Evals schema
        run: |
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path('skills/altium-pcb/evals/evals.json').read_text())
          assert data['skill_name'] == 'altium-pcb'
          cases = data['evals']
          assert cases, 'no eval cases'
          for case in cases:
              assert case['id'] and case['prompt'] and case['expected_output']
              assert case['expectations'], f"case {case['id']} has no expectations"
              assert 'assertions' not in case, "use 'expectations' (skill-creator schema)"
          print(f'{len(cases)} eval cases OK')
          PY
