name: powersupply skill

on:
  push:
    paths:
      - 'skills/powersupply/**'
      - '.github/workflows/powersupply-tests.yml'
  pull_request:
    paths:
      - 'skills/powersupply/**'
      - '.github/workflows/powersupply-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        working-directory: skills/powersupply
        run: python -m pytest tests -q
      - name: CLI smoke test
        working-directory: skills/powersupply
        run: python scripts/psu.py --help
