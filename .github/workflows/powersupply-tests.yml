name: powersupply skill

on:
  push:
    paths:
      - 'skills/powersupply/**'
      - '.github/workflows/powersupply-tests.yml'
  pull_request:
    paths:
      - 'skills/powersupply/**'
      - '.github/workflows/powersupply-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        working-directory: skills/powersupply
        run: python scripts/psu.py test --install
      - name: CLI smoke test
        working-directory: skills/powersupply
        run: python scripts/psu.py --help

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build web UI
        working-directory: skills/powersupply/webapp
        run: npm ci && npm run build

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Test Go core
        working-directory: skills/powersupply/go
        run: go test -race ./...
      - name: Cross-build command
        working-directory: skills/powersupply/go
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/psu.exe ./cmd/psu
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/psu ./cmd/psu
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui" -o /tmp/psu-desktop.exe ./cmd/psu-desktop
