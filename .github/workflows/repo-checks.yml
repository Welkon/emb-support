name: repo checks

on:
  push:
    paths:
      - 'skills/**'
      - 'specs/**'
      - 'tests/**'
      - '.github/workflows/repo-checks.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'specs/**'
      - 'tests/**'
      - '.github/workflows/repo-checks.yml'

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skill and build-script checks
        run: node tests/run-tests.cjs

  specs:
    # specs/ is the distribution source for `emb-agent install --spec <name>`:
    # the installer fetches
    # https://raw.githubusercontent.com/Welkon/emb-support/main/specs/<name>.md
    # so a spec must stay a flat <name>.md with matching frontmatter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate spec files
        run: |
          python - <<'PY'
          import pathlib, re, sys

          specs = pathlib.Path('specs')
          # README.md documents the directory and is not a selectable spec.
          files = sorted(f for f in specs.glob('*.md') if f.name != 'README.md')
          problems = []

          stray = [p for p in specs.rglob('*') if p.is_file() and p.parent != specs]
          for p in stray:
              problems.append(f'{p}: specs must be flat, keep it at specs/<name>.md')

          if not files:
              problems.append('specs/ has no *.md files')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if not text.startswith('---'):
                  problems.append(f'{path}: missing frontmatter')
                  continue
              try:
                  front = text.split('---', 2)[1]
              except IndexError:
                  problems.append(f'{path}: unterminated frontmatter')
                  continue
              name = re.search(r'^name:\s*(\S+)\s*$', front, re.M)
              if not name:
                  problems.append(f'{path}: frontmatter needs name')
              elif name.group(1) != path.stem:
                  problems.append(f"{path}: name '{name.group(1)}' does not match the file name")
              for field in ('title', 'summary'):
                  if not re.search(rf'^{field}:\s*\S', front, re.M):
                      problems.append(f'{path}: frontmatter needs {field}')

          if problems:
              print('\n'.join(problems))
              sys.exit(1)
          print(f'{len(files)} spec files OK')
          PY
